<div class="erp-empty-container">
  <div class="empty-icon-wrap">
    <i [class]="icon()" aria-hidden="true"></i>
  </div>
  <h3 class="empty-title">{{ title() }}</h3>
  @if (description()) {
    <p class="empty-description">{{ description() }}</p>
  }
  @if (actionLabel()) {
    <p-button [label]="actionLabel()!" [icon]="actionIcon()" (click)="action.emit()" size="small"></p-button>
  }
</div>
