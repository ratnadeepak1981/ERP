<app-module-overview
  [config]="overviewConfig()"
  [loading]="loading()"
  [error]="error()"
  [isAccessDenied]="isAccessDenied()"
  [accessDeniedMessage]="accessDeniedMessage()"
  [scopeRequired]="!scopeService.canOperateTransactions()"
  [recentData]="recentOrders()"
  [recentColumns]="recentColumns"
  [recentActions]="recentActions()"
  recentRowKey="id"
  [statusOptions]="statusOptions"
  [activeStatusFilter]="recentStatusFilter()"
  [activeSearchTerm]="recentSearchTerm()"
  (refresh)="loadOverviewData()"
  (searchChange)="recentSearchTerm.set($event)"
  (statusChange)="recentStatusFilter.set($event)"
  (recentRowClick)="navigateToOrder($event)"
  (viewAll)="navigateToAllOrders()"
  (createAction)="navigateToCreate()"
  (cardClick)="onCardClick($event)"
  (stageClick)="onStageClick($event)"
></app-module-overview>
